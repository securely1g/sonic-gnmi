name: Native subscription regression

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription:
    name: Subscription shutdown race (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates curl git patch pkg-config \
            python3 python3-dev tar unzip zstd swig redis-server rsync \
            libboost-system-dev libboost-thread-dev libboost-serialization-dev \
            libhiredis-dev libzmq3-dev cppzmq-dev nlohmann-json3-dev uuid-dev libpam0g-dev libpcre2-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.9'
          cache: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: native-subscription-amd64
          cache-version: '8.5.1'
      - name: Test the exact source and reproduce the original race
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BAZELISK_GITHUB_TOKEN: ''
          GOTOOLCHAIN: local
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/ci/native_subscription.py \
            --work-dir "$RUNNER_TEMP/native-subscription" \
            --evidence "$GITHUB_WORKSPACE/native-subscription-evidence"
      - name: Upload native source and race evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-subscription-amd64
          path: native-subscription-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
